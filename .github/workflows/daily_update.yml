name: Atualizacao dos dados ANA

on:
  schedule:
    - cron: "0 * * * *"      # a cada hora, no minuto 0 (ANA atualiza a cada ~15 min)
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

# permite ao job commitar de volta no repositorio
permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar telemetria ANA
        run: python etl/fetch_telemetry.py

      - name: Recalcular indice
        run: python etl/build_index.py

      - name: Commitar dados atualizados
        run: |
          git config user.name  "river-bot"
          git config user.email "river-bot@users.noreply.github.com"
          git add data/current data/status.json
          if git diff --staged --quiet; then
            echo "Sem mudancas nos dados."
          else
            git commit -m "data: atualizacao $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
